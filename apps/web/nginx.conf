# universal links (UL fix 2026-07-20): ONE image serves both hosts, but
# each host must claim ONLY its own app — the combined file made iOS
# offer the prod app on the dev domain. conf.d files are included at
# http level, so the map may live here, above the server block.
map $host $ul_channel {
    default prod;
    munni-test.okkes.synology.me dev;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # PWA rules: the app shell and service worker must never be cached
    # stale, hashed assets are immutable. Each add_header location must
    # re-include the security headers (nginx inheritance rule).
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    # per-deployment config overlay, rewritten by the entrypoint — must
    # never be cached stale or a redeploy keeps serving old endpoints
    location = /runtime-config.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # universal links (UL1): Apple/Google fetch these — JSON type, no
    # redirects, modest cache so fixes propagate; content is per-host
    location = /.well-known/apple-app-site-association {
        alias /usr/share/nginx/html/.well-known/apple-app-site-association.$ul_channel;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /apple-app-site-association {
        alias /usr/share/nginx/html/.well-known/apple-app-site-association.$ul_channel;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /.well-known/assetlinks.json {
        alias /usr/share/nginx/html/.well-known/assetlinks.$ul_channel.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # hash-history SPA: unknown paths fall back to the shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
