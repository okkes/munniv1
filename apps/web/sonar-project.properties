# Analyzed by deploy/sonar/analyze.ps1 against the local SonarQube
# (deploy/docker-compose.sonar.yml). Not used in CI.
sonar.projectKey=munni-web
sonar.projectName=munni web
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/i18n/**,src/db/demo-data.ts,src/db/demo-rich.ts,src/domain/keyword-categories.ts,src/domain/categories.ts,src/domain/countries.ts,src/**/*.scratch.test.ts
# bootstrap + service-worker runtime glue: only executable in a real
# browser; their decision logic lives in tested modules
sonar.coverage.exclusions=src/main.tsx,src/sw.ts,src/test/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Accepted conventions (reviewed 2026-07-07) — suppressed deliberately:
#  S7764  browser-only PWA: `window` is the intended global, globalThis adds nothing
#  S3735  `void somePromise` is our explicit fire-and-forget marker for local writes
#  S6759  React props are already treated as immutable; Readonly<> wrappers are noise
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S7764
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S3735
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
