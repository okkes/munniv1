<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <!-- interactive-widget: Android resizes the layout for the keyboard and
       restores it when it hides (any way it hides); iOS ignores the field -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <!-- NOT black-translucent: modern iOS then sizes the standalone layout
       926−statusbar tall but anchors it at the glass TOP, leaving an
       unpaintable band under the tab bar (proven via the diagnostics
       overlay: viewport 879 at glass 0, tabbar CSS bottom 926 clipped at
       879). With 'default' the webview sits below the status bar and
       reaches the real bottom; theme-color paints the bar's band. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#191714" media="(prefers-color-scheme: dark)"/>
  <title>munni — finance app</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
