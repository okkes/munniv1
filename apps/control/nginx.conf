server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # shared-services cockpit: never index, never frame
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/security-headers.conf;

    # no service worker here — plain SPA. Each add_header location must
    # re-include the shared headers (nginx inheritance rule).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    # per-deployment config overlay, rewritten by the entrypoint — must
    # never be cached stale or a redeploy keeps serving old endpoints
    location = /runtime-config.js {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
