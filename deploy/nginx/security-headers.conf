# Shared security headers. nginx's add_header is NOT inherited into any
# location that declares its own add_header, so every such location must
# include this file again.
#
# CSP notes:
# - script-src 'self' is the real XSS backstop for OIDC tokens living in
#   localStorage (local-first trade-off, see docs/security-review.md).
#   index.html contains no inline scripts; Vite emits external modules.
# - style-src needs 'unsafe-inline' for React inline style attributes.
# - connect-src stays open so one image serves every environment
#   (API/Logto/GlitchTip origins differ per env); the protection we care
#   about is blocking foreign *script*, not foreign fetch targets.
# - img-src allows any https image: recurring-cost logos come from
#   logo.dev, bank logos from the API's vendored copies — images cannot
#   run script, so a host list buys nothing but breakage here.
# - frame-ancestors 'none' supersedes X-Frame-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src *; manifest-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# #160 r3: camera=() FORBADE getUserMedia document-wide — Chromium obeys
# silently (no prompt, no address-bar icon; the r2 gesture button changed
# nothing). self re-arms the webcam capture; mic/geo stay locked.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
