# Minimal stack for sync e2e in CI: api (TestMode auth) + postgres.
# Run from repo root:
#   docker compose -f deploy/docker-compose.test.yml up --build -d
name: munni-e2e
services:
  api:
    build:
      context: ../server
      dockerfile: src/Munni.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Host=postgres;Database=munni;Username=munni;Password=test
      Db__AutoMigrate: "true"
      Auth__TestMode: "true"
      Cors__Origins__0: http://localhost:5174
    ports:
      # 8181: keeps the full local stack (Logto auth) free to own 8180
      - "8181:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: munni
      POSTGRES_PASSWORD: test
      POSTGRES_DB: munni
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munni"]
      interval: 5s
      timeout: 3s
      retries: 10
