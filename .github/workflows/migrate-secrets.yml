# Environment-first secrets (user ruling 2026-08-28: repo-level
# secrets/variables are legacy — tracks own their configuration).
# Secrets are write-only via the API, so ONLY a workflow (which can read
# them) can copy the existing repo-level values into the environments.
# Environment secrets SHADOW repo-level ones of the same name, so every
# copied name is served env-first immediately, with zero workflow
# conditionals; the repo-level originals can be deleted once nothing
# reads them.
name: Migrate secrets to environments

# dispatch works only for default-branch workflows — until this file
# reaches master it triggers itself on its own changes instead
on:
  workflow_dispatch: {}
  push:
    branches: [dev, master]
    paths: ['.github/workflows/migrate-secrets.yml']

permissions: {}

jobs:
  migrate:
    # first-boot latch: fresh repo copies skip every run until the
    # wizard marks the repo initialized (variable MUNNI_INITIALIZED)
    if: ${{ vars.MUNNI_INITIALIZED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Copy native signing/publishing secrets into the track environments
        env:
          GH_TOKEN: ${{ secrets.IAC_GH_PAT }}
          GH_REPO: ${{ github.repository }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::IAC_GH_PAT is not stored — the wizard's GitHub card does that"
            exit 1
          fi
          for envname in production staging local; do
            gh api -X PUT "repos/$GH_REPO/environments/$envname" >/dev/null
            for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID APPLE_DEV_CERT_P12 APPLE_DEV_CERT_PASSWORD; do
              val="${!name:-}"
              if [ -n "$val" ]; then
                printf %s "$val" | gh secret set "$name" --env "$envname" --repo "$GH_REPO"
                echo "copied $name -> $envname"
              else
                echo "skipped $name (empty at repo level)"
              fi
            done
          done
          echo "done — these names now resolve environment-first everywhere"
