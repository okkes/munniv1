# One-time (rerunnable) helper: mints a persistent Apple Development
# certificate WITHOUT a Mac — openssl makes the key + CSR, the App Store
# Connect API signs it, and the encrypted .p12 lands as a build artifact
# (next to its serial). Afterwards store the artifact's content as the
# APPLE_DEV_CERT_P12 secret (`gh secret set`) EVERYWHERE the secret lives
# — repository level and each environment that overrides it — because
# the whole Apple team shares this ONE certificate: the iOS workflow
# then imports instead of minting, refuses to build with a revoked one,
# and Apple's "certificate revoked" emails stop (native-setup §5b).
#
# The p12 is encrypted with the APPLE_DEV_CERT_PASSWORD secret, which
# must exist BEFORE dispatching. The private key never appears in logs.
name: Mint Apple signing certificate

on:
  workflow_dispatch:
    inputs:
      environment:
        # the wizard's local track keeps its store credentials in the
        # GitHub environment `local` — the job must run INSIDE it to see
        # them (repository-level secrets stay visible either way)
        description: 'GitHub environment carrying ASC_KEY_* + APPLE_DEV_CERT_PASSWORD (repo-level secrets work with any)'
        required: false
        type: string
        default: 'local'

permissions:
  contents: read

jobs:
  mint:
    # macOS: its LibreSSL writes p12s Apple's security tool actually
    # reads, and the same run PROVES the import works before the file
    # ever becomes a secret (the ubuntu/OpenSSL-3 attempt shipped a p12
    # that `security import` rejected)
    runs-on: macos-26
    environment: ${{ inputs.environment || 'local' }}
    steps:
      - uses: actions/checkout@v7

      - name: Preflight
        run: |
          if [ -z "$ASC_KEY_B64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::ASC_KEY_P8 and APPLE_DEV_CERT_PASSWORD secrets are required"
            exit 1
          fi
          echo "$ASC_KEY_B64" | base64 -d > "$RUNNER_TEMP/asc.p8"
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_P8 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}

      - name: Key + CSR (openssl, no Mac involved)
        run: |
          openssl genrsa -out "$RUNNER_TEMP/dev.key" 2048
          openssl req -new -key "$RUNNER_TEMP/dev.key" \
            -subj "/CN=munni CI Development/O=munni" \
            -out "$RUNNER_TEMP/dev.csr"

      # Apple caps Development certificates per team and the throwaways
      # CI minted while no persistent one was in place count against it
      # (the twelfth was refused on 2026-09-09) — clear them, but NEVER
      # the certificate this environment still holds: a re-mint while it
      # is valid must not break the builds signing with it (the
      # 2026-09-08 mint cleared the deck blindly and took the hosted
      # track's certificate with it)
      - name: Clear throwaway Development certificates (never the one still in use)
        run: |
          PROTECT=""
          if [ -n "$CERT_B64" ]; then
            echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/current.p12"
            PROTECT="$(openssl pkcs12 -in "$RUNNER_TEMP/current.p12" -nokeys -passin env:P12_PASSWORD 2>/dev/null | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2)"
            rm -f "$RUNNER_TEMP/current.p12"
            echo "this environment already holds a certificate (serial ${PROTECT:-unreadable}) — it stays"
          fi
          PROTECT_SERIALS="$PROTECT" node .github/scripts/asc-prune.js
        env:
          KEEP_NEWEST: '0'
          CERT_B64: ${{ secrets.APPLE_DEV_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Ask App Store Connect to sign it
        run: |
          node .github/scripts/asc-mint-cert.js "$RUNNER_TEMP/dev.csr" > "$RUNNER_TEMP/cert.b64"
          base64 -d < "$RUNNER_TEMP/cert.b64" > "$RUNNER_TEMP/dev.der" # BSD base64: stdin only
          openssl x509 -inform DER -in "$RUNNER_TEMP/dev.der" -out "$RUNNER_TEMP/dev.pem"
          openssl x509 -in "$RUNNER_TEMP/dev.pem" -noout -subject -serial -enddate
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Bundle the encrypted p12 (base64, secret-ready)
        run: |
          openssl pkcs12 -export \
            -inkey "$RUNNER_TEMP/dev.key" \
            -in "$RUNNER_TEMP/dev.pem" \
            -name "munni CI Development" \
            -passout env:P12_PASSWORD \
            -out "$RUNNER_TEMP/dev.p12"
          # prove the exact bytes + password open in a keychain BEFORE
          # they become the secret — no more mint-then-discover cycles
          security create-keychain -p ci "$RUNNER_TEMP/verify.keychain-db"
          security import "$RUNNER_TEMP/dev.p12" -k "$RUNNER_TEMP/verify.keychain-db" -P "$P12_PASSWORD" -A -f pkcs12
          security find-identity -v "$RUNNER_TEMP/verify.keychain-db" || true
          mkdir -p out
          base64 -i "$RUNNER_TEMP/dev.p12" | tr -d '\n' > out/APPLE_DEV_CERT_P12.b64
          # the serial rides along: the wizard asks Apple by serial whether
          # the machine's certificate is still valid before every build
          openssl x509 -in "$RUNNER_TEMP/dev.pem" -noout -serial | cut -d= -f2 | sed 's/^0*//' | tr -d '\n' > out/APPLE_DEV_CERT_SERIAL.txt
        env:
          P12_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}

      - name: Upload (download → gh secret set APPLE_DEV_CERT_P12 < file, everywhere the secret lives)
        uses: actions/upload-artifact@v7
        with:
          name: apple-dev-cert-p12
          path: |
            out/APPLE_DEV_CERT_P12.b64
            out/APPLE_DEV_CERT_SERIAL.txt
          retention-days: 1
