# Fetch diagnostics from the NAS without SSH: downloads deploy.log (and
# the latest status dump update.sh writes) via the FileStation API and
# attaches them as a short-lived artifact. Dispatch-only.
name: NAS diagnostics

on:
  workflow_dispatch:
    inputs:
      file:
        description: "File to fetch, relative to the live dir (SYNOLOGY_PATH's parent)"
        default: "deploy.log"
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download from FileStation
        run: |
          mkdir -p diag
          # live dir = parent of the published dir (SYNOLOGY_PATH secret),
          # so no share names are guessed here
          LIVE="${SYNOLOGY_PATH%/*}"
          if [ "${{ inputs.file }}" = "list" ]; then
            bash deploy/nas/download.sh "$LIVE/" "diag/listing.json"
          else
            bash deploy/nas/download.sh "$LIVE/${{ inputs.file }}" "diag/$(basename "${{ inputs.file }}")"
          fi
          # redact anything that looks like a credential before it leaves the runner
          sed -i -E 's/(password|passwd|secret|token|key)=[^ ]*/\1=REDACTED/Ig' diag/* || true
        env:
          SYNOLOGY_URL: ${{ secrets.SYNOLOGY_URL }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PASS: ${{ secrets.SYNOLOGY_PASS }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}

      - uses: actions/upload-artifact@v7
        with:
          name: nas-diag
          path: diag/
          retention-days: 1
